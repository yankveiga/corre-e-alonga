name: corre_alonga
description: Treinos intervalados locais com tempo monotônico e identidade original.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  drift: ^2.30.0
  drift_flutter: ^0.3.0
  flutter_tts: ^4.2.5
  just_audio: ^0.10.5
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/alongapet-logo.png
    - assets/audio/interval.wav
    - assets/fonts/LICENSE.txt
  fonts:
    - family: RunSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
